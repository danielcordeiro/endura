<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Supplement</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d7ff2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                        "pre-workout": "#0d7ff2",
                        "during-workout": "#16a34a",
                        "post-workout": "#f97316",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1c2a38",
                        "text-light": "#101922",
                        "text-dark": "#f5f7f8",
                        "subtle-text-light": "#6b7280",
                        "subtle-text-dark": "#9ca3af",
                        "border-light": "#e5e7eb",
                        "border-dark": "#374151"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .phase-radio:checked+.phase-label {
            border-color: transparent;
            color: white;
        }
        .phase-radio[value="pre"]:checked+.phase-label {
            background-color: #0d7ff2;
        }
        .phase-radio[value="during"]:checked+.phase-label {
            background-color: #16a34a;
        }
        .phase-radio[value="post"]:checked+.phase-label {
            background-color: #f97316;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="max-w-md mx-auto bg-surface-light dark:bg-surface-dark shadow-lg rounded-xl overflow-hidden">
<div class="relative p-6">
<h1 class="text-2xl font-bold text-center text-text-light dark:text-text-dark">Log Supplement</h1>
<button class="absolute top-6 right-6 text-subtle-text-light dark:text-subtle-text-dark">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path>
</svg>
</button>
</div>
<form class="p-6 pt-0 space-y-6">
<div class="space-y-2">
<label class="text-sm font-medium text-subtle-text-light dark:text-subtle-text-dark" for="product">Product</label>
<input class="w-full px-4 py-3 bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark border border-border-light dark:border-border-dark rounded-lg focus:ring-primary focus:border-primary placeholder-subtle-text-light dark:placeholder-subtle-text-dark" id="product" placeholder="e.g., SIS Go Isotonic Gel" type="text"/>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-subtle-text-light dark:text-subtle-text-dark" for="quantity">Quantity / Portions</label>
<input class="w-full px-4 py-3 bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark border border-border-light dark:border-border-dark rounded-lg focus:ring-primary focus:border-primary placeholder-subtle-text-light dark:placeholder-subtle-text-dark" id="quantity" placeholder="1" type="number"/>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-subtle-text-light dark:text-subtle-text-dark">Phase</label>
<div class="grid grid-cols-3 gap-2">
<div>
<input checked="" class="sr-only phase-radio" id="pre" name="phase" type="radio" value="pre"/>
<label class="phase-label flex items-center justify-center w-full px-4 py-3 text-center border rounded-lg cursor-pointer transition-colors border-border-light dark:border-border-dark text-subtle-text-light dark:text-subtle-text-dark" for="pre">Pre</label>
</div>
<div>
<input class="sr-only phase-radio" id="during" name="phase" type="radio" value="during"/>
<label class="phase-label flex items-center justify-center w-full px-4 py-3 text-center border rounded-lg cursor-pointer transition-colors border-border-light dark:border-border-dark text-subtle-text-light dark:text-subtle-text-dark" for="during">During</label>
</div>
<div>
<input class="sr-only phase-radio" id="post" name="phase" type="radio" value="post"/>
<label class="phase-label flex items-center justify-center w-full px-4 py-3 text-center border rounded-lg cursor-pointer transition-colors border-border-light dark:border-border-dark text-subtle-text-light dark:text-subtle-text-dark" for="post">Post</label>
</div>
</div>
</div>
<div class="space-y-2">
<p class="text-sm font-medium text-subtle-text-light dark:text-subtle-text-dark">Nutrients (Optional)</p>
<div class="grid grid-cols-2 gap-4">
<input class="w-full px-4 py-3 bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark border border-border-light dark:border-border-dark rounded-lg focus:ring-primary focus:border-primary placeholder-subtle-text-light dark:placeholder-subtle-text-dark" placeholder="Carbs (g)" type="number"/>
<input class="w-full px-4 py-3 bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark border border-border-light dark:border-border-dark rounded-lg focus:ring-primary focus:border-primary placeholder-subtle-text-light dark:placeholder-subtle-text-dark" placeholder="Sodium (mg)" type="number"/>
<input class="w-full px-4 py-3 bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark border border-border-light dark:border-border-dark rounded-lg focus:ring-primary focus:border-primary placeholder-subtle-text-light dark:placeholder-subtle-text-dark" placeholder="Caffeine (mg)" type="number"/>
<input class="w-full px-4 py-3 bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark border border-border-light dark:border-border-dark rounded-lg focus:ring-primary focus:border-primary placeholder-subtle-text-light dark:placeholder-subtle-text-dark" placeholder="Kcal" type="number"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4 pt-4">
<button class="w-full px-6 py-4 font-bold text-center bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark rounded-lg" type="button">Cancel</button>
<button class="w-full px-6 py-4 font-bold text-center text-white bg-primary rounded-lg" type="submit">Save</button>
</div>
</form>
</div>

</body></html>
